<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Artify | Neural Style Transfer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 2rem;
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 3rem;
            font-size: 1.2rem;
        }

        .drop-zone-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .drop-zone {
            background: var(--card-bg);
            border: 2px dashed rgba(148, 163, 184, 0.3);
            border-radius: 24px;
            padding: 2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            aspect-ratio: 4/3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
        }

        .drop-zone:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px -10px var(--accent-glow);
        }

        .drop-zone.active {
            border-color: var(--accent);
            background: rgba(139, 92, 246, 0.1);
        }

        .drop-zone input {
            display: none;
        }

        .drop-zone p {
            font-weight: 600;
            color: var(--text);
            margin-top: 1rem;
        }

        .drop-zone span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .icon {
            width: 48px;
            height: 48px;
            stroke: var(--accent);
        }

        .preview-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 22px;
            display: none;
        }

        .btn-convert {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-convert:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.6);
        }

        .btn-convert:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #loading {
            margin-top: 2rem;
            display: none;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #result-container {
            margin-top: 3rem;
            display: none;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-img {
            max-width: 100%;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .drop-zone-container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="main-container">
        <h1>AI ARTIFY</h1>
        <p class="subtitle">Transform any photograph into a masterpiece with Neural Style Transfer</p>

        <div class="drop-zone-container">
            <div class="drop-zone" id="content-drop">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <p>Content Image</p>
                <span>Upload PNG, JPG, or JPEG</span>
                <input type="file" id="content-input" accept=".png,.jpg,.jpeg">
                <img id="content-preview" class="preview-img">
            </div>

            <div class="drop-zone" id="style-drop">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                    <path d="M2 2l7.586 7.586"></path>
                    <circle cx="11" cy="11" r="2"></circle>
                </svg>
                <p>Style Reference</p>
                <span>Upload PNG, JPG, or JPEG</span>
                <input type="file" id="style-input" accept=".png,.jpg,.jpeg">
                <img id="style-preview" class="preview-img">
            </div>
        </div>

        <button class="btn-convert" id="convert-btn">Create Masterpiece</button>

        <div id="loading">
            <span class="loader"></span>
            <p style="margin-top: 1rem; color: var(--text-muted);">Brewing your art... This may take a minute.</p>
        </div>

        <div id="result-container">
            <h2 style="margin-bottom: 2rem;">Your Masterpiece</h2>
            <img id="result-img" class="result-img">
            <div style="margin-top: 2rem;">
                <button class="btn-convert" onclick="location.reload()"
                    style="background: rgba(255,255,255,0.1); box-shadow: none;">New Project</button>
            </div>
        </div>
    </div>

    <script>
        const setupDropZone = (dropZoneId, inputId, previewId) => {
            const dropZone = document.getElementById(dropZoneId);
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);

            dropZone.onclick = () => input.click();

            dropZone.onsragover = (e) => {
                e.preventDefault();
                dropZone.classList.add('active');
            };

            dropZone.ondragleave = () => dropZone.classList.remove('active');

            dropZone.ondrop = (e) => {
                e.preventDefault();
                dropZone.classList.remove('active');
                if (e.dataTransfer.files.length) {
                    input.files = e.dataTransfer.files;
                    handleFiles(input.files[0], preview);
                }
            };

            input.onchange = () => {
                if (input.files.length) {
                    handleFiles(input.files[0], preview);
                }
            };
        };

        const handleFiles = (file, preview) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        };

        setupDropZone('content-drop', 'content-input', 'content-preview');
        setupDropZone('style-drop', 'style-input', 'style-preview');

        document.getElementById('convert-btn').onclick = async () => {
            const contentFile = document.getElementById('content-input').files[0];
            const styleFile = document.getElementById('style-input').files[0];

            if (!contentFile || !styleFile) {
                alert('Please select both a content image and a style reference!');
                return;
            }

            const formData = new FormData();
            formData.append('content', contentFile);
            formData.append('style', styleFile);

            // UI Changes
            document.getElementById('convert-btn').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.result_url) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('result-img').src = data.result_url;
                    document.getElementById('result-container').style.display = 'block';
                    document.getElementById('result-container').scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert(data.error || 'Error processing image');
                    document.getElementById('convert-btn').style.display = 'block';
                    document.getElementById('loading').style.display = 'none';
                }
            } catch (error) {
                console.error(error);
                alert('Server error. Make sure app.py is running.');
                document.getElementById('convert-btn').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        };
    </script>
</body>

</html>
